name: Clinical Release Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'scripts/seed_critical_drugs.py'
      - '.github/workflows/clinical_release_publish.yml'

permissions:
  contents: write

concurrency:
  group: clinical-release-publisher
  cancel-in-progress: true

jobs:
  publish-clinical-release:
    name: publish-clinical-release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: nursing_mvp
          POSTGRES_USER: nursing_app
          POSTGRES_PASSWORD: nursing_app_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nursing_app -d nursing_mvp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://nursing_app:nursing_app_ci@localhost:5432/nursing_mvp
      PYTHONPATH: .

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Migrate clinical database
        run: alembic -c alembic.ini upgrade head

      - name: Validate current CMED source format
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          from scripts.cmed_enrichment import _download_cmed, load_cmed_dataframe

          url, content, _ = asyncio.run(_download_cmed())
          frame = load_cmed_dataframe(content)
          assert "REGISTRO" in frame.columns
          assert "APRESENTACAO" in frame.columns
          assert len(frame) > 0
          print("CMED source:", url)
          print("CMED rows:", len(frame))
          print("CMED columns:", list(frame.columns[:20]))
          PY

      - name: Ingest latest ANVISA open data
        run: python scripts/etl_anvisa.py

      - name: Resolve canonical medication entities
        run: python scripts/entity_resolution.py

      - name: Enrich commercial presentations from CMED
        run: python scripts/cmed_enrichment.py

      - name: Curate safe structured concentrations
        run: python scripts/clinical_curation.py

      - name: Seed critical administration guidance
        run: python ../scripts/seed_critical_drugs.py

      - name: Seed structured public professional leaflets
        run: python scripts/seed_structured_leaflets.py

      - name: Start sync API locally
        shell: bash
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/nursing-api.log 2>&1 &
          echo $! > /tmp/nursing-api.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nursing-api.log
          exit 1

      - name: Export public clinical release
        shell: bash
        run: |
          mkdir -p ../clinical-releases
          curl --fail --show-error --silent \
            http://127.0.0.1:8000/v1/sync/content \
            -o ../clinical-releases/clinical-release-v1.json
          gzip -9 -c ../clinical-releases/clinical-release-v1.json \
            > ../clinical-releases/clinical-release-v1.json.gz

      - name: Validate exported release
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import gzip

          path = Path("clinical-releases/clinical-release-v1.json")
          gzip_path = Path("clinical-releases/clinical-release-v1.json.gz")
          raw = path.read_bytes()
          compressed = gzip_path.read_bytes()
          assert gzip.decompress(compressed) == raw
          assert len(compressed) < len(raw)
          data = json.loads(raw.decode("utf-8"))
          assert data["release_schema"] == "clinical-release-v1"
          assert data["content_version"].startswith("clinical-release-v1-")
          assert len(data["active_ingredients"]) > 0
          assert len(data["medications"]) > 0
          assert len(data["presentations"]) > 0
          assert len(data["administration_guidance"]) > 0
          assert len(data["incompatibilities"]) > 0
          assert len(data["professional_leaflets"]) > 0
          assert len(data["medication_leaflet_links"]) > 0
          assert all(
              item.get("regulatory_status", "").casefold() != "inativo"
              for item in data["medications"]
          )
          reduction = 100 * (1 - len(compressed) / len(raw))
          print(
              "release:",
              data["content_version"],
              "raw_bytes:",
              len(raw),
              "gzip_bytes:",
              len(compressed),
              "gzip_reduction_pct:",
              round(reduction, 1),
              "ingredients:",
              len(data["active_ingredients"]),
              "medications:",
              len(data["medications"]),
              "presentations:",
              len(data["presentations"]),
              "administration_guidance:",
              len(data["administration_guidance"]),
              "incompatibilities:",
              len(data["incompatibilities"]),
              "professional_leaflets:",
              len(data["professional_leaflets"]),
              "medication_leaflet_links:",
              len(data["medication_leaflet_links"]),
          )
          PY

      - name: Publish release JSON to repository
        working-directory: .
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- clinical-releases/clinical-release-v1.json clinical-releases/clinical-release-v1.json.gz)" ]; then
            echo "Clinical release unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clinical-releases/clinical-release-v1.json clinical-releases/clinical-release-v1.json.gz
          git commit -m "data: publish latest clinical release"
          git pull --rebase origin main
          git push origin HEAD:main
