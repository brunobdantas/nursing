name: Android Release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android_release.yml"
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'mobile/.release-trigger'

permissions:
  contents: read

jobs:
  build-android-apk:
    name: build-android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Show release toolchain versions
        run: |
          flutter --version
          dart --version
          java -version
          gradle --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify public clinical release is available
        shell: bash
        run: |
          curl --fail --show-error --location --retry 5 --retry-delay 2 \
            https://raw.githubusercontent.com/brunobdantas/nursing/main/clinical-releases/clinical-release-v1.json.gz \
            -o /tmp/clinical-release-v1.json.gz
          python3 - <<'PY'
          import gzip
          import json
          from pathlib import Path

          raw = gzip.decompress(Path("/tmp/clinical-release-v1.json.gz").read_bytes())
          data = json.loads(raw.decode("utf-8"))
          assert data["release_schema"] == "clinical-release-v1"
          assert len(data["active_ingredients"]) > 0
          assert len(data["medications"]) > 0
          assert len(data["presentations"]) > 0
          assert len(data.get("professional_leaflets", [])) > 0
          assert len(data.get("medication_leaflet_links", [])) > 0
          print(
              data["content_version"],
              "medications=", len(data["medications"]),
              "presentations=", len(data["presentations"]),
              "leaflets=", len(data["professional_leaflets"]),
              "leaflet_links=", len(data["medication_leaflet_links"]),
          )
          PY

      - name: Generate deterministic branding assets
        run: python3 tool/generate_brand_assets.py

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate native splash screen
        run: dart run flutter_native_splash:create

      - name: Prepare Gradle wrapper
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          cd android
          gradle wrapper --gradle-version 9.3.1 --distribution-type all
          chmod +x gradlew

      - name: Build obfuscated release APK
        run: >-
          flutter build apk --release --obfuscate
          --split-debug-info=build/app/outputs/symbols

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nursing-app-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
