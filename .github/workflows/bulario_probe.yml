name: Bulário Source Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bulario_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official Bulário CSVs
        shell: bash
        run: |
          curl --fail --show-error --location --retry 3             https://dados.anvisa.gov.br/dados/CONSULTAS/DOCUMENTOS/TA_CONSULTA_BULA_PRODUTO.CSV             -o /tmp/bula_produto.csv
          curl --fail --show-error --location --retry 3             https://dados.anvisa.gov.br/dados/CONSULTAS/DOCUMENTOS/TA_CONSULTA_BULA_DOCUMENTO.CSV             -o /tmp/bula_documento.csv

      - name: Inspect schema and sample rows
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          def decode(path):
              raw=Path(path).read_bytes()
              for enc in ("utf-8-sig","utf-8","latin1","cp1252"):
                  try:
                      return raw.decode(enc), enc
                  except UnicodeDecodeError:
                      pass
              raise RuntimeError(path)

          for path in ("/tmp/bula_produto.csv","/tmp/bula_documento.csv"):
              text,enc=decode(path)
              sample=text[:65536]
              delimiter=";" if sample.count(";") >= sample.count(",") else ","
              rows=csv.reader(text.splitlines(), delimiter=delimiter)
              print("FILE", Path(path).name, "ENCODING", enc, "DELIMITER", repr(delimiter))
              for i,row in enumerate(rows):
                  print("ROW",i,row)
                  if i>=3:
                      break
          PY


      - name: Inspect open-source Bulário CSV adapter
        shell: bash
        run: |
          cd /tmp
          npm pack @mcpassure/mcp-anvisa-bulario@2.1.10 --silent
          mkdir -p /tmp/mcpassure
          tar -xzf mcpassure-mcp-anvisa-bulario-2.1.10.tgz -C /tmp/mcpassure
          python3 - <<'PY'
          from pathlib import Path
          root=Path("/tmp/mcpassure/package")
          needles=(
              "TA_CONSULTA_BULA_PRODUTO",
              "TA_CONSULTA_BULA_DOCUMENTO",
              "downloadPDF",
              "numeroRegistro",
              "bula_profissional",
          )
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  text=path.read_text(encoding="utf-8")
              except Exception:
                  continue
              if any(n in text for n in needles):
                  print("\n###", path.relative_to(root))
                  lines=text.splitlines()
                  for i,line in enumerate(lines):
                      if any(n in line for n in needles):
                          start=max(0,i-20); end=min(len(lines),i+50)
                          print("\n".join(lines[start:end]))
          PY


      - name: Inspect package CSV schema importer
        shell: bash
        run: |
          cd /tmp
          if [ ! -d /tmp/mcpassure/package ]; then
            npm pack @mcpassure/mcp-anvisa-bulario@2.1.10 --silent
            mkdir -p /tmp/mcpassure
            tar -xzf mcpassure-mcp-anvisa-bulario-2.1.10.tgz -C /tmp/mcpassure
          fi
          python3 - <<'PY'
          from pathlib import Path
          root=Path("/tmp/mcpassure/package")
          for path in sorted(root.rglob("*.js")):
              try:
                  text=path.read_text(encoding="utf-8")
              except Exception:
                  continue
              if (
                  "numero_registro" in text
                  and ("csv" in path.name.lower() or "import" in path.name.lower() or "dataset" in path.name.lower())
              ):
                  print("\n###", path.relative_to(root))
                  print(text[:30000])
          PY


      - name: Probe product-document key relationships
        shell: bash
        run: |
          echo "Matches for product field 35239160:"
          grep -m 5 '35239160' /tmp/bula_documento.csv || true
          echo "Matches for product field 0633153265:"
          grep -m 5 '0633153265' /tmp/bula_documento.csv || true
          echo "Matches for product field 8483662026:"
          grep -m 5 '8483662026' /tmp/bula_documento.csv || true
          echo "Matches for process 250000031219551:"
          grep -m 5 '250000031219551' /tmp/bula_documento.csv || true


      - name: Probe Bulário document download endpoint
        shell: bash
        run: |
          set +e
          curl --show-error --location --retry 2             -D /tmp/bula_headers.txt             https://consultas.anvisa.gov.br/api/consulta/downloadPDF/35239160             -o /tmp/bula_probe.bin
          status=$?
          echo "curl_status=$status"
          cat /tmp/bula_headers.txt || true
          file /tmp/bula_probe.bin || true
          wc -c /tmp/bula_probe.bin || true
          head -c 32 /tmp/bula_probe.bin | xxd || true
          exit 0


      - name: Probe live Bulário API with browser transport
        shell: bash
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 --silent
          npx playwright install chromium >/dev/null
          cat > /tmp/probe-bulario.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            userAgent:
              'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
              '(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
          });
          const page = await context.newPage();
          await page.goto('https://consultas.anvisa.gov.br/', {
            waitUntil: 'domcontentloaded',
            timeout: 120000,
          });
          await page.waitForTimeout(5000);

          const search = await page.evaluate(async () => {
            const url =
              '/api/consulta/bulario?page=1&count=10&numeroRegistro=103460005';
            const response = await fetch(url, {
              headers: { Accept: 'application/json' },
              credentials: 'include',
            });
            return {
              status: response.status,
              text: (await response.text()).slice(0, 12000),
            };
          });
          console.log('SEARCH', JSON.stringify(search));

          if (search.status === 200) {
            const parsed = JSON.parse(search.text);
            const item = parsed.content?.[0];
            console.log('FIRST_ITEM', JSON.stringify(item));
            const process =
              item?.numeroProcesso ??
              item?.numProcesso ??
              item?.processo ??
              item?.processoProduto;
            if (process) {
              const detail = await page.evaluate(async (p) => {
                const response = await fetch(
                  '/api/consulta/medicamento/produtos/' + encodeURIComponent(p),
                  {
                    headers: { Accept: 'application/json' },
                    credentials: 'include',
                  },
                );
                return {
                  status: response.status,
                  text: (await response.text()).slice(0, 20000),
                };
              }, process);
              console.log('DETAIL', JSON.stringify(detail));

              if (detail.status === 200) {
                const d = JSON.parse(detail.text);
                const token =
                  d.codigoBulaProfissional ?? d.idBulaProfissionalProtegido;
                console.log('PROF_TOKEN_PRESENT', Boolean(token));
                if (token) {
                  const link = await page.evaluate(async (t) => {
                    const response = await fetch(
                      '/api/consulta/medicamentos/arquivo/bula/parecer/' +
                        encodeURIComponent(t) +
                        '/',
                      {
                        headers: { Accept: 'application/json' },
                        credentials: 'include',
                      },
                    );
                    return {
                      status: response.status,
                      text: (await response.text()).slice(0, 8000),
                    };
                  }, token);
                  console.log('PROF_LINK', JSON.stringify(link));
                }
              }
            }
          }
          await browser.close();
          JS
          node /tmp/probe-bulario.mjs


      - name: Print Anvisa API adapter source
        shell: bash
        run: |
          sed -n '1,240p' /tmp/mcpassure/package/dist/sources/anvisa-api.js
