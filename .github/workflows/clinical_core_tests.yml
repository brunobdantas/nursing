name: Clinical Core Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/clinical_core_tests.yml'
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/clinical_core_tests.yml'

permissions:
  contents: write

concurrency:
  group: clinical-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clinical-core-tests:
    name: clinical-core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter from pubspec
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: mobile/pubspec.yaml
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply Dart formatting
        run: dart format lib test

      - name: Commit formatter output on main
        if: github.event_name == 'push'
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- mobile/lib mobile/test; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib mobile/test
          git commit -m "style: apply dart format for cycle 8"
          git push origin HEAD:main

      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run mobile and clinical tests
        run: flutter test --reporter expanded
