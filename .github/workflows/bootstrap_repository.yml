name: Bootstrap Repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    name: materialize-source
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct consolidated source files
        shell: bash
        run: |
          set -euo pipefail
          reconstruct() {
            local target="$1"
            local stem="${target//\//__}"
            mkdir -p "$(dirname "$target")"
            cat .bootstrap_parts/${stem}.b64.part* | base64 --decode > "$target"
          }
          reconstruct backend/alembic/versions/001_initial_schema.py
          reconstruct backend/app/api/router.py
          reconstruct backend/app/db/models.py
          reconstruct backend/scripts/etl_anvisa.py
          reconstruct mobile/lib/core/calculation/calculation_core.dart
          reconstruct mobile/test/calculation_core_test.dart
          reconstruct scripts/publish_github.sh
          chmod +x scripts/publish_github.sh
          sha256sum -c .bootstrap_parts/SHA256SUMS

      - name: Remove bootstrap artifacts
        run: |
          rm -rf .bootstrap_parts
          rm -f .github/workflows/bootstrap_repository.yml

      - name: Commit materialized repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: materialize consolidated project source"
          git push origin HEAD:main
