name: Fix and Format Clinical Workspace

on:
  push:
    branches: [main]
    paths:
      - 'mobile/lib/**'
      - 'mobile/test/**'
      - '.github/workflows/format_leaflet_integration.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Apply analyzer fixes and format
        working-directory: mobile
        run: |
          dart fix --apply
          dart format lib test

      - name: Commit fixes when needed
        shell: bash
        run: |
          if git diff --quiet -- mobile/lib mobile/test; then
            echo "No source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib mobile/test
          git commit -m "style: apply analyzer fixes to clinical workspace"
          git pull --rebase origin main
          git push origin HEAD:main
