name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-android-apk:
    name: build-android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Show release toolchain versions
        run: |
          flutter --version
          dart --version
          java -version
          gradle --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate deterministic branding assets
        run: python3 tool/generate_brand_assets.py

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate native splash screen
        run: dart run flutter_native_splash:create

      - name: Prepare Gradle wrapper
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          cd android
          gradle wrapper --gradle-version 9.3.1 --distribution-type all
          chmod +x gradlew

      - name: Build obfuscated release APK
        run: >-
          flutter build apk --release --obfuscate
          --split-debug-info=build/app/outputs/symbols

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nursing-app-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
