name: Bulario HTTP Integration Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bulario_http_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve and download professional leaflet with HTTP session
        shell: bash
        run: |
          python3 -m pip install --quiet 'requests>=2.32,<3' 'pypdf>=5,<7'
          python3 - <<'PY'
          import json
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          base = "https://consultas.anvisa.gov.br"
          registration = "103460005"
          session = requests.Session()
          session.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 "
                  "(KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36"
              ),
              "Accept-Language": "pt-BR,pt;q=0.9,en;q=0.8",
          })

          warm = session.get(base + "/", timeout=30)
          print("WARM_STATUS", warm.status_code)
          print("WARM_COOKIES", sorted(session.cookies.keys()))
          warm.raise_for_status()

          params = [
              ("column", ""),
              ("count", "10"),
              ("filter[numeroRegistro]", registration),
              ("order", "asc"),
              ("page", "1"),
          ]

          search = None
          for attempt in range(1, 6):
              search = session.get(
                  base + "/api/consulta/bulario",
                  params=params,
                  headers={"Accept": "application/json, text/plain, */*"},
                  timeout=30,
              )
              print("SEARCH_ATTEMPT", attempt, "STATUS", search.status_code)
              if search.status_code == 200:
                  break
              print("SEARCH_ERROR", search.text[:500])
              time.sleep(min(2 * attempt, 6))

          if search is None or search.status_code != 200:
              raise SystemExit("Bulário search unavailable")

          payload = search.json()
          items = payload.get("content") or []
          print("SEARCH_COUNT", len(items))
          if not items:
              raise SystemExit("No Bulário record found")

          item = items[0]
          print("PRODUCT", item.get("nomeProduto"))
          print("REGISTRATION", item.get("numeroRegistro"))
          print("UPDATED_AT", item.get("dataAtualizacao"))
          token = item.get("idBulaProfissionalProtegido")
          print("HAS_PROFESSIONAL_TOKEN", bool(token))
          if not token:
              raise SystemExit("Professional leaflet token missing")

          # Tokens emitted by ANVISA may have an nbf one second ahead of the
          # caller clock. A short grace delay plus retry prevents the observed
          # PrematureJwtException race.
          time.sleep(2.2)

          link_response = None
          for attempt in range(1, 6):
              link_response = session.get(
                  base
                  + "/api/consulta/medicamentos/arquivo/bula/parecer/"
                  + requests.utils.quote(str(token), safe="")
                  + "/",
                  headers={"Accept": "application/json, text/plain, */*"},
                  timeout=30,
              )
              print("LINK_ATTEMPT", attempt, "STATUS", link_response.status_code)
              if link_response.status_code == 200:
                  break
              print("LINK_ERROR", link_response.text[:700])
              time.sleep(1.5 * attempt)

          if link_response is None or link_response.status_code != 200:
              raise SystemExit("Professional leaflet link unavailable")

          content_type = (link_response.headers.get("content-type") or "").lower()
          body = link_response.content

          if body.startswith(b"%PDF"):
              pdf_bytes = body
              print("LINK_RETURNED_PDF_DIRECTLY", True)
          else:
              try:
                  decoded = link_response.json()
              except Exception:
                  decoded = link_response.text.strip().strip('"')
              if isinstance(decoded, dict):
                  link = decoded.get("link") or decoded.get("url") or decoded.get("path")
              else:
                  link = decoded
              print("LINK_PRESENT", bool(link))
              if not link:
                  raise SystemExit("Leaflet link missing from API response")
              if str(link).startswith("/"):
                  link = base + str(link)
              pdf_response = session.get(str(link), timeout=60)
              print("PDF_STATUS", pdf_response.status_code)
              print("PDF_TYPE", pdf_response.headers.get("content-type"))
              pdf_response.raise_for_status()
              pdf_bytes = pdf_response.content

          print("PDF_BYTES", len(pdf_bytes))
          print("PDF_MAGIC", repr(pdf_bytes[:8]))
          if not pdf_bytes.startswith(b"%PDF"):
              raise SystemExit("ANVISA payload is not a PDF")

          pdf_path = Path("/tmp/professional_leaflet.pdf")
          pdf_path.write_bytes(pdf_bytes)
          reader = PdfReader(str(pdf_path))
          text = "\n".join((page.extract_text() or "") for page in reader.pages)
          upper = text.upper()
          print("PDF_PAGES", len(reader.pages))
          print("PDF_TEXT_CHARS", len(text))
          print(
              "PDF_HEADINGS",
              [
                  heading
                  for heading in (
                      "INDICAÇÕES",
                      "CONTRAINDICAÇÕES",
                      "ADVERTÊNCIAS E PRECAUÇÕES",
                      "INTERAÇÕES MEDICAMENTOSAS",
                      "POSOLOGIA E MODO DE USAR",
                      "REAÇÕES ADVERSAS",
                      "SUPERDOSE",
                  )
                  if heading in upper
              ],
          )
          assert len(text.strip()) > 500, "Leaflet contains too little extractable text"
          PY
