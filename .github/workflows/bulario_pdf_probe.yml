name: Bulário PDF Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bulario_pdf_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up browser
        shell: bash
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 --silent
          npx playwright install chromium >/dev/null

      - name: Download known Bulário document through browser session
        shell: bash
        run: |
          cat > /tmp/probe-document.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const documentIds = [
            '35239160',
            '0633153265',
            '8483662026',
            '250000031219551',
          ];
          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            userAgent:
              'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
              '(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
          });
          const page = await context.newPage();
          await page.goto('https://consultas.anvisa.gov.br/', {
            waitUntil: 'domcontentloaded',
            timeout: 120000,
          });
          await page.waitForTimeout(5000);

          for (const documentId of documentIds) {
            const fetched = await page.evaluate(async (id) => {
              const response = await fetch(
                '/api/consulta/downloadPDF/' + encodeURIComponent(id),
                { credentials: 'include' },
              );
              const bytes = new Uint8Array(await response.arrayBuffer());
              let binary = '';
              const chunk = 0x8000;
              for (let offset = 0; offset < bytes.length; offset += chunk) {
                binary += String.fromCharCode(
                  ...bytes.subarray(offset, Math.min(bytes.length, offset + chunk)),
                );
              }
              return {
                status: response.status,
                contentType: response.headers.get('content-type'),
                base64: btoa(binary),
              };
            }, documentId);
            const body = Buffer.from(fetched.base64, 'base64');
            console.log(
              'DOCUMENT_CANDIDATE',
              JSON.stringify({
                id: documentId,
                status: fetched.status,
                contentType: fetched.contentType,
                bytes: body.length,
                magic: body.subarray(0, 8).toString('latin1'),
              }),
            );
            if (
              fetched.status === 200 &&
              body.subarray(0, 4).toString('latin1') === '%PDF'
            ) {
              fs.writeFileSync('/tmp/document.pdf', body);
              console.log('DOCUMENT_WORKING_ID', documentId);
              break;
            }
          }
          await browser.close();
          JS
          cd /tmp
          node /tmp/probe-document.mjs
          if [ -f /tmp/document.pdf ]; then
            python3 -m pip install --quiet 'pypdf>=5,<7'
            python3 - <<'PY'
          from pypdf import PdfReader
          reader=PdfReader("/tmp/document.pdf")
          text="\n".join((page.extract_text() or "") for page in reader.pages)
          print("PDF_PAGES", len(reader.pages))
          print("PDF_TEXT_CHARS", len(text))
          print("PDF_HAS_PROFESSIONAL", "PROFISSIONAL" in text.upper())
          print("PDF_HEADINGS", [
              heading for heading in (
                  "INDICAÇÕES",
                  "CONTRAINDICAÇÕES",
                  "ADVERTÊNCIAS E PRECAUÇÕES",
                  "INTERAÇÕES MEDICAMENTOSAS",
                  "POSOLOGIA E MODO DE USAR",
                  "REAÇÕES ADVERSAS",
              ) if heading in text.upper()
          ])
          print("PDF_TEXT_PREFIX", repr(text[:1800]))
          PY
          fi


      - name: Capture Bulário UI network contract
        shell: bash
        run: |
          cat > /tmp/capture-bulario-ui.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            userAgent:
              'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
              '(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
          });
          const page = await context.newPage();
          const apiEvents = [];
          page.on('request', (request) => {
            const url = request.url();
            if (url.includes('/api/consulta/')) {
              apiEvents.push({
                type: 'request',
                method: request.method(),
                url,
                postData: request.postData(),
              });
            }
          });
          page.on('response', async (response) => {
            const url = response.url();
            if (url.includes('/api/consulta/')) {
              apiEvents.push({
                type: 'response',
                status: response.status(),
                url,
              });
            }
          });

          await page.goto('https://consultas.anvisa.gov.br/#/bulario/', {
            waitUntil: 'networkidle',
            timeout: 120000,
          });
          await page.waitForTimeout(4000);

          const inputs = await page.locator('input').evaluateAll((nodes) =>
            nodes.map((node, index) => ({
              index,
              type: node.getAttribute('type'),
              name: node.getAttribute('name'),
              id: node.getAttribute('id'),
              placeholder: node.getAttribute('placeholder'),
              ariaLabel: node.getAttribute('aria-label'),
            })),
          );
          const buttons = await page.locator('button').evaluateAll((nodes) =>
            nodes.map((node, index) => ({
              index,
              text: (node.textContent ?? '').trim().replace(/\s+/g, ' '),
              type: node.getAttribute('type'),
              id: node.getAttribute('id'),
              ariaLabel: node.getAttribute('aria-label'),
            })),
          );
          console.log('UI_INPUTS', JSON.stringify(inputs));
          console.log('UI_BUTTONS', JSON.stringify(buttons.slice(0, 40)));

          const textInputs = page.locator('input[type="text"]');
          const count = await textInputs.count();
          console.log('TEXT_INPUT_COUNT', count);
          for (let i = 0; i < count; i += 1) {
            const input = textInputs.nth(i);
            const placeholder = (await input.getAttribute('placeholder')) ?? '';
            const name = (await input.getAttribute('name')) ?? '';
            const id = (await input.getAttribute('id')) ?? '';
            if (/medic|produto|nome/i.test(placeholder + ' ' + name + ' ' + id)) {
              await input.fill('GLICOSE BEKER');
              console.log('FILLED_INPUT', i, placeholder, name, id);
              break;
            }
          }

          const consult = page.getByRole('button', {
            name: /consultar|pesquisar|buscar/i,
          }).first();
          if (await consult.count()) {
            console.log('CLICK_BUTTON', await consult.innerText());
            await consult.click();
            await page.waitForTimeout(8000);
          } else {
            console.log('NO_CONSULT_BUTTON');
          }

          console.log('API_EVENTS', JSON.stringify(apiEvents, null, 2));
          console.log(
            'RESULT_TEXT',
            (await page.locator('body').innerText()).slice(0, 12000),
          );
          await browser.close();
          JS
          cd /tmp
          node /tmp/capture-bulario-ui.mjs


      - name: Capture Bulário query by registration number
        shell: bash
        run: |
          cat > /tmp/capture-by-registration.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            userAgent:
              'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
              '(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
          });
          const page = await context.newPage();
          const events = [];
          page.on('request', (request) => {
            if (request.url().includes('/api/consulta/')) {
              events.push({
                type: 'request',
                method: request.method(),
                url: request.url(),
                postData: request.postData(),
              });
            }
          });
          page.on('response', (response) => {
            if (response.url().includes('/api/consulta/')) {
              events.push({
                type: 'response',
                status: response.status(),
                url: response.url(),
              });
            }
          });

          await page.goto('https://consultas.anvisa.gov.br/#/bulario/', {
            waitUntil: 'networkidle',
            timeout: 120000,
          });
          await page.waitForTimeout(3000);

          await page.locator('#txtNumeroRegistro').fill('103460005');
          console.log(
            'REGISTRATION_VALUE',
            await page.locator('#txtNumeroRegistro').inputValue(),
          );

          const submit = page.locator('input[type="submit"]').first();
          console.log('SUBMIT_COUNT', await submit.count());
          if (await submit.count()) {
            await submit.click();
            await page.waitForTimeout(10000);
          }

          console.log('REGISTRATION_API_EVENTS', JSON.stringify(events, null, 2));
          console.log(
            'REGISTRATION_RESULT_TEXT',
            (await page.locator('body').innerText()).slice(0, 16000),
          );
          await browser.close();
          JS
          cd /tmp
          node /tmp/capture-by-registration.mjs
