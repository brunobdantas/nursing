name: Bulário PDF Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bulario_pdf_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up browser
        shell: bash
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 --silent
          npx playwright install chromium >/dev/null

      - name: Download known Bulário document through browser session
        shell: bash
        run: |
          cat > /tmp/probe-document.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const documentIds = [
            '35239160',
            '0633153265',
            '8483662026',
            '250000031219551',
          ];
          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            userAgent:
              'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
              '(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
          });
          const page = await context.newPage();
          await page.goto('https://consultas.anvisa.gov.br/', {
            waitUntil: 'domcontentloaded',
            timeout: 120000,
          });
          await page.waitForTimeout(5000);

          for (const documentId of documentIds) {
            const fetched = await page.evaluate(async (id) => {
              const response = await fetch(
                '/api/consulta/downloadPDF/' + encodeURIComponent(id),
                { credentials: 'include' },
              );
              const bytes = new Uint8Array(await response.arrayBuffer());
              let binary = '';
              const chunk = 0x8000;
              for (let offset = 0; offset < bytes.length; offset += chunk) {
                binary += String.fromCharCode(
                  ...bytes.subarray(offset, Math.min(bytes.length, offset + chunk)),
                );
              }
              return {
                status: response.status,
                contentType: response.headers.get('content-type'),
                base64: btoa(binary),
              };
            }, documentId);
            const body = Buffer.from(fetched.base64, 'base64');
            console.log(
              'DOCUMENT_CANDIDATE',
              JSON.stringify({
                id: documentId,
                status: fetched.status,
                contentType: fetched.contentType,
                bytes: body.length,
                magic: body.subarray(0, 8).toString('latin1'),
              }),
            );
            if (
              fetched.status === 200 &&
              body.subarray(0, 4).toString('latin1') === '%PDF'
            ) {
              fs.writeFileSync('/tmp/document.pdf', body);
              console.log('DOCUMENT_WORKING_ID', documentId);
              break;
            }
          }
          await browser.close();
          JS
          cd /tmp
          node /tmp/probe-document.mjs
          if [ -f /tmp/document.pdf ]; then
            python3 -m pip install --quiet 'pypdf>=5,<7'
            python3 - <<'PY'
          from pypdf import PdfReader
          reader=PdfReader("/tmp/document.pdf")
          text="\n".join((page.extract_text() or "") for page in reader.pages)
          print("PDF_PAGES", len(reader.pages))
          print("PDF_TEXT_CHARS", len(text))
          print("PDF_HAS_PROFESSIONAL", "PROFISSIONAL" in text.upper())
          print("PDF_HEADINGS", [
              heading for heading in (
                  "INDICAÇÕES",
                  "CONTRAINDICAÇÕES",
                  "ADVERTÊNCIAS E PRECAUÇÕES",
                  "INTERAÇÕES MEDICAMENTOSAS",
                  "POSOLOGIA E MODO DE USAR",
                  "REAÇÕES ADVERSAS",
              ) if heading in text.upper()
          ])
          print("PDF_TEXT_PREFIX", repr(text[:1800]))
          PY
          fi


      - name: Capture Bulário UI network contract
        shell: bash
        run: |
          cat > /tmp/capture-bulario-ui.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            userAgent:
              'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
              '(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
          });
          const page = await context.newPage();
          const apiEvents = [];
          page.on('request', (request) => {
            const url = request.url();
            if (url.includes('/api/consulta/')) {
              apiEvents.push({
                type: 'request',
                method: request.method(),
                url,
                postData: request.postData(),
              });
            }
          });
          page.on('response', async (response) => {
            const url = response.url();
            if (url.includes('/api/consulta/')) {
              apiEvents.push({
                type: 'response',
                status: response.status(),
                url,
              });
            }
          });

          await page.goto('https://consultas.anvisa.gov.br/#/bulario/', {
            waitUntil: 'networkidle',
            timeout: 120000,
          });
          await page.waitForTimeout(4000);

          const inputs = await page.locator('input').evaluateAll((nodes) =>
            nodes.map((node, index) => ({
              index,
              type: node.getAttribute('type'),
              name: node.getAttribute('name'),
              id: node.getAttribute('id'),
              placeholder: node.getAttribute('placeholder'),
              ariaLabel: node.getAttribute('aria-label'),
            })),
          );
          const buttons = await page.locator('button').evaluateAll((nodes) =>
            nodes.map((node, index) => ({
              index,
              text: (node.textContent ?? '').trim().replace(/\s+/g, ' '),
              type: node.getAttribute('type'),
              id: node.getAttribute('id'),
              ariaLabel: node.getAttribute('aria-label'),
            })),
          );
          console.log('UI_INPUTS', JSON.stringify(inputs));
          console.log('UI_BUTTONS', JSON.stringify(buttons.slice(0, 40)));

          const textInputs = page.locator('input[type="text"]');
          const count = await textInputs.count();
          console.log('TEXT_INPUT_COUNT', count);
          for (let i = 0; i < count; i += 1) {
            const input = textInputs.nth(i);
            const placeholder = (await input.getAttribute('placeholder')) ?? '';
            const name = (await input.getAttribute('name')) ?? '';
            const id = (await input.getAttribute('id')) ?? '';
            if (/medic|produto|nome/i.test(placeholder + ' ' + name + ' ' + id)) {
              await input.fill('GLICOSE BEKER');
              console.log('FILLED_INPUT', i, placeholder, name, id);
              break;
            }
          }

          const consult = page.getByRole('button', {
            name: /consultar|pesquisar|buscar/i,
          }).first();
          if (await consult.count()) {
            console.log('CLICK_BUTTON', await consult.innerText());
            await consult.click();
            await page.waitForTimeout(8000);
          } else {
            console.log('NO_CONSULT_BUTTON');
          }

          console.log('API_EVENTS', JSON.stringify(apiEvents, null, 2));
          console.log(
            'RESULT_TEXT',
            (await page.locator('body').innerText()).slice(0, 12000),
          );
          await browser.close();
          JS
          cd /tmp
          node /tmp/capture-bulario-ui.mjs


      - name: Capture Bulário query by registration number
        shell: bash
        run: |
          cat > /tmp/capture-by-registration.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            userAgent:
              'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
              '(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
          });
          const page = await context.newPage();
          const events = [];
          page.on('request', (request) => {
            if (request.url().includes('/api/consulta/')) {
              events.push({
                type: 'request',
                method: request.method(),
                url: request.url(),
                postData: request.postData(),
              });
            }
          });
          page.on('response', (response) => {
            if (response.url().includes('/api/consulta/')) {
              events.push({
                type: 'response',
                status: response.status(),
                url: response.url(),
              });
            }
          });

          await page.goto('https://consultas.anvisa.gov.br/#/bulario/', {
            waitUntil: 'networkidle',
            timeout: 120000,
          });
          await page.waitForTimeout(3000);

          await page.locator('#txtNumeroRegistro').fill('103460005');
          console.log(
            'REGISTRATION_VALUE',
            await page.locator('#txtNumeroRegistro').inputValue(),
          );

          const submit = page.locator('input[type="submit"]').first();
          console.log('SUBMIT_COUNT', await submit.count());
          if (await submit.count()) {
            await submit.click();
            await page.waitForTimeout(10000);
          }

          console.log('REGISTRATION_API_EVENTS', JSON.stringify(events, null, 2));
          console.log(
            'REGISTRATION_RESULT_TEXT',
            (await page.locator('body').innerText()).slice(0, 16000),
          );
          await browser.close();
          JS
          cd /tmp
          node /tmp/capture-by-registration.mjs


      - name: Resolve professional leaflet from exact Bulário API contract
        shell: bash
        run: |
          cat > /tmp/resolve-professional-bula.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const registration = '103460005';
          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            userAgent:
              'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
              '(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
          });
          const page = await context.newPage();
          await page.goto('https://consultas.anvisa.gov.br/#/bulario/', {
            waitUntil: 'networkidle',
            timeout: 120000,
          });
          await page.waitForTimeout(3000);

          const result = await page.evaluate(async (reg) => {
            const params = new URLSearchParams({
              column: '',
              count: '10',
              'filter[numeroRegistro]': reg,
              order: 'asc',
              page: '1',
            });
            const response = await fetch(
              '/api/consulta/bulario?' + params.toString(),
              {
                headers: { Accept: 'application/json' },
                credentials: 'include',
              },
            );
            return { status: response.status, text: await response.text() };
          }, registration);

          console.log('EXACT_SEARCH_STATUS', result.status);
          if (result.status !== 200) {
            console.log('EXACT_SEARCH_BODY', result.text.slice(0, 4000));
            await browser.close();
            process.exit(0);
          }

          const parsed = JSON.parse(result.text);
          console.log('EXACT_SEARCH_COUNT', parsed.content?.length ?? 0);
          const first = parsed.content?.[0];
          if (!first) {
            await browser.close();
            process.exit(0);
          }
          console.log('EXACT_ITEM_KEYS', Object.keys(first).sort());
          const safeItem = { ...first };
          for (const key of Object.keys(safeItem)) {
            if (/codigoBula|Protegido|token|jwt/i.test(key)) {
              safeItem[key] = safeItem[key] ? '<present>' : null;
            }
          }
          console.log('EXACT_ITEM_SAFE', JSON.stringify(safeItem));

          const processNumber =
            first.numeroProcesso ??
            first.numProcesso ??
            first.processo ??
            first.processoProduto;
          console.log('EXACT_PROCESS', processNumber ?? null);

          let professionalToken =
            first.codigoBulaProfissional ??
            first.idBulaProfissionalProtegido;

          if (!professionalToken && processNumber) {
            const detail = await page.evaluate(async (process) => {
              const response = await fetch(
                '/api/consulta/medicamento/produtos/' +
                  encodeURIComponent(String(process)),
                {
                  headers: { Accept: 'application/json' },
                  credentials: 'include',
                },
              );
              return { status: response.status, text: await response.text() };
            }, processNumber);
            console.log('EXACT_DETAIL_STATUS', detail.status);
            if (detail.status === 200) {
              const value = JSON.parse(detail.text);
              console.log('EXACT_DETAIL_KEYS', Object.keys(value).sort());
              professionalToken =
                value.codigoBulaProfissional ??
                value.idBulaProfissionalProtegido;
              console.log('EXACT_DETAIL_HAS_PROF_TOKEN', Boolean(professionalToken));
            }
          } else {
            console.log('EXACT_ITEM_HAS_PROF_TOKEN', Boolean(professionalToken));
          }

          if (!professionalToken) {
            await browser.close();
            process.exit(0);
          }

          const linkResult = await page.evaluate(async (token) => {
            const response = await fetch(
              '/api/consulta/medicamentos/arquivo/bula/parecer/' +
                encodeURIComponent(token) +
                '/',
              {
                headers: { Accept: 'application/json' },
                credentials: 'include',
              },
            );
            return { status: response.status, text: await response.text() };
          }, professionalToken);
          console.log('EXACT_LINK_STATUS', linkResult.status);
          if (linkResult.status !== 200) {
            console.log('EXACT_LINK_BODY', linkResult.text.slice(0, 3000));
            await browser.close();
            process.exit(0);
          }

          let link;
          try {
            const value = JSON.parse(linkResult.text);
            link = typeof value === 'string' ? value : (value.link ?? value.url);
          } catch {
            link = linkResult.text.replace(/^"|"$/g, '');
          }
          console.log('EXACT_LINK_PRESENT', Boolean(link));
          if (!link) {
            await browser.close();
            process.exit(0);
          }

          const pdf = await page.evaluate(async (url) => {
            const response = await fetch(url, { credentials: 'include' });
            const bytes = new Uint8Array(await response.arrayBuffer());
            let binary = '';
            const chunk = 0x8000;
            for (let offset = 0; offset < bytes.length; offset += chunk) {
              binary += String.fromCharCode(
                ...bytes.subarray(offset, Math.min(bytes.length, offset + chunk)),
              );
            }
            return {
              status: response.status,
              contentType: response.headers.get('content-type'),
              base64: btoa(binary),
            };
          }, link);
          const body = Buffer.from(pdf.base64, 'base64');
          console.log('EXACT_PDF_STATUS', pdf.status);
          console.log('EXACT_PDF_CONTENT_TYPE', pdf.contentType);
          console.log('EXACT_PDF_BYTES', body.length);
          console.log('EXACT_PDF_MAGIC', body.subarray(0, 8).toString('latin1'));
          if (pdf.status === 200 && body.subarray(0, 4).toString('latin1') === '%PDF') {
            fs.writeFileSync('/tmp/exact_professional_leaflet.pdf', body);
          }
          await browser.close();
          JS
          cd /tmp
          node /tmp/resolve-professional-bula.mjs
          if [ -f /tmp/exact_professional_leaflet.pdf ]; then
            python3 -m pip install --quiet 'pypdf>=5,<7'
            python3 - <<'PY'
          from pypdf import PdfReader
          reader=PdfReader("/tmp/exact_professional_leaflet.pdf")
          text="\n".join((page.extract_text() or "") for page in reader.pages)
          print("EXACT_PDF_PAGES", len(reader.pages))
          print("EXACT_PDF_TEXT_CHARS", len(text))
          upper=text.upper()
          print("EXACT_PDF_HEADINGS", [
              heading for heading in (
                  "INDICAÇÕES",
                  "CONTRAINDICAÇÕES",
                  "ADVERTÊNCIAS E PRECAUÇÕES",
                  "INTERAÇÕES MEDICAMENTOSAS",
                  "POSOLOGIA E MODO DE USAR",
                  "REAÇÕES ADVERSAS",
              ) if heading in upper
          ])
          print("EXACT_PDF_PREFIX", repr(text[:1600]))
          PY
          fi


      - name: Capture rendered professional leaflet action
        shell: bash
        run: |
          cat > /tmp/capture-rendered-leaflet.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            userAgent:
              'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
              '(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
          });
          const page = await context.newPage();
          const events = [];
          page.on('request', (request) => {
            if (request.url().includes('/api/consulta/')) {
              events.push({
                type: 'request',
                method: request.method(),
                url: request.url(),
              });
            }
          });
          page.on('response', (response) => {
            if (response.url().includes('/api/consulta/')) {
              events.push({
                type: 'response',
                status: response.status(),
                url: response.url(),
              });
            }
          });

          await page.goto('https://consultas.anvisa.gov.br/#/bulario/', {
            waitUntil: 'networkidle',
            timeout: 120000,
          });
          await page.waitForTimeout(3000);
          await page.locator('#txtNumeroRegistro').fill('103460005');

          const responsePromise = page.waitForResponse(
            (response) =>
              response.url().includes('/api/consulta/bulario?') &&
              response.status() === 200,
            { timeout: 30000 },
          );
          await page.locator('input[type="submit"]').first().click();
          const searchResponse = await responsePromise;
          const json = await searchResponse.json();
          const first = json.content?.[0] ?? null;
          console.log('UI_RESPONSE_COUNT', json.content?.length ?? 0);
          if (first) {
            console.log('UI_RESPONSE_KEYS', Object.keys(first).sort());
            const safe = { ...first };
            for (const key of Object.keys(safe)) {
              if (/codigo|token|jwt|protegido/i.test(key)) {
                safe[key] = safe[key] ? '<present>' : safe[key];
              }
            }
            console.log('UI_RESPONSE_SAFE', JSON.stringify(safe));
          }

          await page.waitForTimeout(3000);
          const rows = page.locator('table tbody tr');
          console.log('RESULT_ROW_COUNT', await rows.count());
          if (await rows.count()) {
            const row = rows.first();
            console.log('RESULT_ROW_HTML', (await row.innerHTML()).slice(0, 20000));
            const actions = await row.locator('a,button').evaluateAll((nodes) =>
              nodes.map((node, index) => ({
                index,
                tag: node.tagName,
                text: (node.textContent ?? '').trim().replace(/\s+/g, ' '),
                href: node.getAttribute('href'),
                title: node.getAttribute('title'),
                ariaLabel: node.getAttribute('aria-label'),
                ngClick:
                  node.getAttribute('ng-click') ??
                  node.getAttribute('data-ng-click'),
                className: node.getAttribute('class'),
              })),
            );
            console.log('RESULT_ACTIONS', JSON.stringify(actions));

            const cells = row.locator('td');
            console.log('RESULT_CELL_COUNT', await cells.count());
            for (let i = 0; i < await cells.count(); i += 1) {
              const cell = cells.nth(i);
              console.log(
                'RESULT_CELL',
                JSON.stringify({
                  index: i,
                  text: (await cell.innerText()).trim(),
                  html: (await cell.innerHTML()).slice(0, 5000),
                }),
              );
            }
          }

          console.log('PRE_CLICK_EVENTS', JSON.stringify(events, null, 2));
          await browser.close();
          JS
          cd /tmp
          node /tmp/capture-rendered-leaflet.mjs


      - name: Download professional leaflet from UI response token
        shell: bash
        run: |
          cat > /tmp/download-ui-token-leaflet.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            userAgent:
              'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
              '(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
          });
          const page = await context.newPage();
          await page.goto('https://consultas.anvisa.gov.br/#/bulario/', {
            waitUntil: 'networkidle',
            timeout: 120000,
          });
          await page.waitForTimeout(2500);
          await page.locator('#txtNumeroRegistro').fill('103460005');

          const responsePromise = page.waitForResponse(
            (response) =>
              response.url().includes('/api/consulta/bulario?') &&
              response.status() === 200,
            { timeout: 30000 },
          );
          await page.locator('input[type="submit"]').first().click();
          const searchResponse = await responsePromise;
          const result = await searchResponse.json();
          const item = result.content?.[0];
          const token = item?.idBulaProfissionalProtegido;
          console.log('TOKEN_FLOW_HAS_TOKEN', Boolean(token));
          if (!token) {
            await browser.close();
            process.exit(0);
          }

          const linkResult = await page.evaluate(async (protectedId) => {
            const response = await fetch(
              '/api/consulta/medicamentos/arquivo/bula/parecer/' +
                encodeURIComponent(protectedId) +
                '/',
              {
                headers: {
                  Accept: 'application/json, text/plain, */*',
                },
                credentials: 'include',
              },
            );
            return {
              status: response.status,
              contentType: response.headers.get('content-type'),
              text: await response.text(),
            };
          }, token);
          console.log('TOKEN_FLOW_LINK_STATUS', linkResult.status);
          console.log('TOKEN_FLOW_LINK_TYPE', linkResult.contentType);
          if (linkResult.status !== 200) {
            console.log('TOKEN_FLOW_LINK_ERROR', linkResult.text.slice(0, 1200));
            await browser.close();
            process.exit(0);
          }

          let link;
          try {
            const decoded = JSON.parse(linkResult.text);
            link =
              typeof decoded === 'string'
                ? decoded
                : (decoded.link ?? decoded.url ?? decoded.path);
          } catch {
            link = linkResult.text.replace(/^"|"$/g, '').trim();
          }
          console.log('TOKEN_FLOW_LINK_PRESENT', Boolean(link));
          if (!link) {
            await browser.close();
            process.exit(0);
          }

          const resolved = new URL(link, 'https://consultas.anvisa.gov.br/');
          console.log('TOKEN_FLOW_LINK_HOST', resolved.host);
          console.log('TOKEN_FLOW_LINK_PATH', resolved.pathname.slice(0, 120));

          const pdfResult = await page.evaluate(async (url) => {
            const response = await fetch(url, { credentials: 'include' });
            const bytes = new Uint8Array(await response.arrayBuffer());
            let binary = '';
            const chunkSize = 0x8000;
            for (let offset = 0; offset < bytes.length; offset += chunkSize) {
              binary += String.fromCharCode(
                ...bytes.subarray(offset, Math.min(bytes.length, offset + chunkSize)),
              );
            }
            return {
              status: response.status,
              contentType: response.headers.get('content-type'),
              base64: btoa(binary),
            };
          }, resolved.toString());

          const body = Buffer.from(pdfResult.base64, 'base64');
          console.log('TOKEN_FLOW_PDF_STATUS', pdfResult.status);
          console.log('TOKEN_FLOW_PDF_TYPE', pdfResult.contentType);
          console.log('TOKEN_FLOW_PDF_BYTES', body.length);
          console.log('TOKEN_FLOW_PDF_MAGIC', body.subarray(0, 8).toString('latin1'));
          if (
            pdfResult.status === 200 &&
            body.subarray(0, 4).toString('latin1') === '%PDF'
          ) {
            fs.writeFileSync('/tmp/token_professional_leaflet.pdf', body);
          }
          await browser.close();
          JS
          cd /tmp
          node /tmp/download-ui-token-leaflet.mjs
          if [ -f /tmp/token_professional_leaflet.pdf ]; then
            python3 -m pip install --quiet 'pypdf>=5,<7'
            python3 - <<'PY'
          from pypdf import PdfReader
          reader=PdfReader("/tmp/token_professional_leaflet.pdf")
          text="\n".join((page.extract_text() or "") for page in reader.pages)
          upper=text.upper()
          print("TOKEN_PDF_PAGES", len(reader.pages))
          print("TOKEN_PDF_TEXT_CHARS", len(text))
          print("TOKEN_PDF_HEADINGS", [
              heading for heading in (
                  "INDICAÇÕES",
                  "CONTRAINDICAÇÕES",
                  "ADVERTÊNCIAS E PRECAUÇÕES",
                  "INTERAÇÕES MEDICAMENTOSAS",
                  "POSOLOGIA E MODO DE USAR",
                  "REAÇÕES ADVERSAS",
                  "SUPERDOSE",
              ) if heading in upper
          ])
          print("TOKEN_PDF_PREFIX", repr(text[:1800]))
          PY
          fi


      - name: Capture Bulário request headers
        shell: bash
        run: |
          cat > /tmp/capture-bulario-headers.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            userAgent:
              'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
              '(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
          });
          const page = await context.newPage();
          let captured = null;
          page.on('request', async (request) => {
            if (
              !captured &&
              request.url().includes('/api/consulta/bulario?')
            ) {
              captured = {
                url: request.url(),
                method: request.method(),
                headers: await request.allHeaders(),
              };
            }
          });
          await page.goto('https://consultas.anvisa.gov.br/#/bulario/', {
            waitUntil: 'networkidle',
            timeout: 120000,
          });
          await page.waitForTimeout(2500);
          await page.locator('#txtNumeroRegistro').fill('103460005');
          const responsePromise = page.waitForResponse(
            (response) =>
              response.url().includes('/api/consulta/bulario?') &&
              response.status() === 200,
            { timeout: 30000 },
          );
          await page.locator('input[type="submit"]').first().click();
          await responsePromise;
          const safeHeaders = { ...(captured?.headers ?? {}) };
          delete safeHeaders.cookie;
          delete safeHeaders.authorization;
          console.log('UI_REQUEST_CONTRACT', JSON.stringify({
            url: captured?.url,
            method: captured?.method,
            headers: safeHeaders,
          }, null, 2));
          await browser.close();
          JS
          cd /tmp
          node /tmp/capture-bulario-headers.mjs


      - name: Validate professional leaflet binary payload
        shell: bash
        run: |
          cat > /tmp/validate-professional-binary.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            userAgent:
              'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 ' +
              '(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
          });
          const page = await context.newPage();
          await page.goto('https://consultas.anvisa.gov.br/#/bulario/', {
            waitUntil: 'networkidle',
            timeout: 120000,
          });
          await page.waitForTimeout(2500);
          await page.locator('#txtNumeroRegistro').fill('103460005');

          const responsePromise = page.waitForResponse(
            (response) =>
              response.url().includes('/api/consulta/bulario?') &&
              response.status() === 200,
            { timeout: 30000 },
          );
          await page.locator('input[type="submit"]').first().click();
          const searchResponse = await responsePromise;
          const result = await searchResponse.json();
          const item = result.content?.[0];
          const token = item?.idBulaProfissionalProtegido;
          console.log('BINARY_HAS_TOKEN', Boolean(token));
          if (!token) {
            await browser.close();
            process.exit(0);
          }

          const binaryResult = await page.evaluate(async (protectedId) => {
            const response = await fetch(
              '/api/consulta/medicamentos/arquivo/bula/parecer/' +
                encodeURIComponent(protectedId) +
                '/',
              {
                headers: { Accept: 'application/pdf,*/*' },
                credentials: 'include',
              },
            );
            const bytes = new Uint8Array(await response.arrayBuffer());
            let binary = '';
            const chunkSize = 0x8000;
            for (let offset = 0; offset < bytes.length; offset += chunkSize) {
              binary += String.fromCharCode(
                ...bytes.subarray(offset, Math.min(bytes.length, offset + chunkSize)),
              );
            }
            return {
              status: response.status,
              contentType: response.headers.get('content-type'),
              base64: btoa(binary),
            };
          }, token);

          const body = Buffer.from(binaryResult.base64, 'base64');
          console.log('BINARY_STATUS', binaryResult.status);
          console.log('BINARY_CONTENT_TYPE', binaryResult.contentType);
          console.log('BINARY_BYTES', body.length);
          console.log('BINARY_MAGIC', body.subarray(0, 8).toString('latin1'));
          if (
            binaryResult.status === 200 &&
            body.subarray(0, 4).toString('latin1') === '%PDF'
          ) {
            fs.writeFileSync('/tmp/professional_binary.pdf', body);
          }
          await browser.close();
          JS
          cd /tmp
          node /tmp/validate-professional-binary.mjs
          if [ -f /tmp/professional_binary.pdf ]; then
            python3 -m pip install --quiet 'pypdf>=5,<7'
            python3 - <<'PY'
          from pypdf import PdfReader
          reader=PdfReader("/tmp/professional_binary.pdf")
          text="\n".join((page.extract_text() or "") for page in reader.pages)
          upper=text.upper()
          print("BINARY_PDF_PAGES", len(reader.pages))
          print("BINARY_PDF_TEXT_CHARS", len(text))
          print("BINARY_PDF_HEADINGS", [
              heading for heading in (
                  "INDICAÇÕES",
                  "CONTRAINDICAÇÕES",
                  "ADVERTÊNCIAS E PRECAUÇÕES",
                  "INTERAÇÕES MEDICAMENTOSAS",
                  "CUIDADOS DE ARMAZENAMENTO",
                  "POSOLOGIA E MODO DE USAR",
                  "REAÇÕES ADVERSAS",
                  "SUPERDOSE",
              ) if heading in upper
          ])
          print("BINARY_PDF_PREFIX", repr(text[:1800]))
          PY
          fi
