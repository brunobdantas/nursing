name: nursing_clinical_core
description: Intelligent drug reference and deterministic clinical calculation core for nursing.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: 3.47.5

dependencies:
  flutter:
    sdk: flutter
  decimal: 3.2.6
  go_router: ^18.0.1
  http: ^1.4.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#005A67"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 23

flutter_native_splash:
  color: "#F8FAFA"
  color_dark: "#101415"
  image: assets/branding/splash_mark.png
  image_dark: assets/branding/splash_mark_dark.png
  android: true
  ios: false
  web: false
  fullscreen: false
  android_12:
    color: "#F8FAFA"
    color_dark: "#101415"
    image: assets/branding/splash_mark.png
    image_dark: assets/branding/splash_mark_dark.png
    icon_background_color: "#F8FAFA"
    icon_background_color_dark: "#101415"
