name: Bulario Browser Integration Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bulario_http_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Playwright
        shell: bash
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install playwright@1.57.0 --silent
          npx playwright install chromium >/dev/null

      - name: Resolve professional leaflet with ANVISA browser transport
        shell: bash
        run: |
          cat > /tmp/bulario-browser-probe.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const registration = '103460005';
          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-blink-features=AutomationControlled'],
          });
          const context = await browser.newContext({
            userAgent:
              'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 ' +
              '(KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36',
          });
          const page = await context.newPage();

          await page.goto('https://consultas.anvisa.gov.br/#/bulario/', {
            waitUntil: 'networkidle',
            timeout: 120000,
          });
          await page.waitForTimeout(2500);
          await page.locator('#txtNumeroRegistro').fill(registration);

          const searchPromise = page.waitForResponse(
            (response) =>
              response.url().includes('/api/consulta/bulario?') &&
              response.status() === 200,
            { timeout: 30000 },
          );
          await page.locator('input[type="submit"]').first().click();
          const searchResponse = await searchPromise;
          const payload = await searchResponse.json();
          const item = payload.content?.[0];
          if (!item) throw new Error('No Bulário record found');

          console.log('PRODUCT', item.nomeProduto);
          console.log('REGISTRATION', item.numeroRegistro);
          console.log('UPDATED_AT', item.dataAtualizacao);
          const token = item.idBulaProfissionalProtegido;
          console.log('HAS_PROFESSIONAL_TOKEN', Boolean(token));
          if (!token) throw new Error('Professional leaflet token missing');

          // ANVISA emits protected JWTs whose nbf may be roughly one second
          // ahead of the requesting clock. Do not hit the resolver immediately.
          await page.waitForTimeout(2200);

          let linkResult = null;
          for (let attempt = 1; attempt <= 5; attempt += 1) {
            linkResult = await page.evaluate(async (protectedId) => {
              const response = await fetch(
                '/api/consulta/medicamentos/arquivo/bula/parecer/' +
                  encodeURIComponent(protectedId) +
                  '/',
                {
                  headers: { Accept: 'application/json, text/plain, */*' },
                  credentials: 'include',
                },
              );
              return {
                status: response.status,
                contentType: response.headers.get('content-type'),
                text: await response.text(),
              };
            }, token);
            console.log('LINK_ATTEMPT', attempt, 'STATUS', linkResult.status);
            if (linkResult.status === 200) break;
            console.log('LINK_ERROR', linkResult.text.slice(0, 700));
            await page.waitForTimeout(1200 * attempt);
          }

          if (!linkResult || linkResult.status !== 200) {
            throw new Error('Professional leaflet resolver failed');
          }

          let link;
          try {
            const decoded = JSON.parse(linkResult.text);
            link =
              typeof decoded === 'string'
                ? decoded
                : (decoded.link ?? decoded.url ?? decoded.path);
          } catch {
            link = linkResult.text.replace(/^"|"$/g, '').trim();
          }
          if (!link) throw new Error('Leaflet link missing');
          const resolved = new URL(link, 'https://consultas.anvisa.gov.br/');
          console.log('LEAFLET_HOST', resolved.host);
          console.log('LEAFLET_PATH_PREFIX', resolved.pathname.slice(0, 160));

          // Verify whether the resolved URL can be downloaded outside page JS
          // with the same browser context. This is the contract the app will use.
          const response = await context.request.get(resolved.toString(), {
            timeout: 120000,
          });
          console.log('PDF_STATUS', response.status());
          console.log('PDF_TYPE', response.headers()['content-type'] ?? null);
          const body = await response.body();
          console.log('PDF_BYTES', body.length);
          console.log('PDF_MAGIC', body.subarray(0, 8).toString('latin1'));
          if (!response.ok() || body.subarray(0, 4).toString('latin1') !== '%PDF') {
            throw new Error('Resolved professional leaflet is not a PDF');
          }
          fs.writeFileSync('/tmp/professional_leaflet.pdf', body);
          await browser.close();
          JS
          node /tmp/bulario-browser-probe.mjs

          python3 -m pip install --quiet 'pypdf>=5,<7'
          python3 - <<'PY'
          from pypdf import PdfReader
          reader = PdfReader("/tmp/professional_leaflet.pdf")
          text = "\n".join((page.extract_text() or "") for page in reader.pages)
          upper = text.upper()
          print("PDF_PAGES", len(reader.pages))
          print("PDF_TEXT_CHARS", len(text))
          print("PDF_HEADINGS", [
              heading for heading in (
                  "INDICAÇÕES",
                  "CONTRAINDICAÇÕES",
                  "ADVERTÊNCIAS E PRECAUÇÕES",
                  "INTERAÇÕES MEDICAMENTOSAS",
                  "POSOLOGIA E MODO DE USAR",
                  "REAÇÕES ADVERSAS",
                  "SUPERDOSE",
              ) if heading in upper
          ])
          assert len(text.strip()) > 500
          PY
